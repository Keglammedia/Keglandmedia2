backend:
  name: github
  repo: Keglammedia/Keglandmedia2
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: feed
    label: News Feed
    files:
      - name: posts
        label: Stories
        file: posts.json
        fields:
          - label: Stories
            name: posts
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { label: Category, name: category, widget: string, hint: "Example: Sports" }
              - { label: Date, name: date, widget: string, hint: "Example: Nov 22, 2026" }
              - { label: Headline, name: title, widget: string }
              - { label: Caption, name: description, widget: text }
              - { label: Photo, name: image, widget: image }
              - label: More photos (optional, up to 11 for the sliding row)
                name: more_photos
                widget: list
                max: 11
                required: false
                fields:
                  - { label: Photo, name: image, widget: image }
              - { label: Photo Credit, name: credit, widget: string, required: false }
      - name: sidebars
        label: Sidebars and Ads
        file: sidebar.json
        fields:
          - { label: Left box title, name: left_title, widget: string, required: false }
          - { label: Company summary, name: left_summary, widget: text, required: false }
          - { label: Contact details, name: left_contact, widget: text, required: false, hint: "One item per line: email, phone, address" }
          - label: Ads
            name: ads
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { label: Ad title (optional), name: title, widget: string, required: false }
              - { label: Ad text (optional), name: text, widget: text, required: false }
              - { label: Ad picture (optional), name: image, widget: image, required: false }
              - { label: Link when clicked (optional), name: link, widget: string, required: false }
